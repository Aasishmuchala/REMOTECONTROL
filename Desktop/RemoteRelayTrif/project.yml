name: TrifectaController
options:
  bundleIdPrefix: com.trifecta.veranza
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  TrifectaController:
    type: application
    platform: iOS
    sources:
      - path: TrifectaController
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trifecta.veranza.controller
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Trifecta Controller"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.business"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  TrifectaControllerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrifectaControllerTests
    dependencies:
      - target: TrifectaController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trifecta.veranza.controller.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrifectaController.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TrifectaController"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TrifectaController:
    build:
      targets:
        TrifectaController: all
        TrifectaControllerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrifectaControllerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
